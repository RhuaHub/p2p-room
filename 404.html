<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#c08b2c">
<title>页面不存在 · P2P 实时共享聊天室</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .nf-card{
    width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius-lg);box-shadow:var(--shadow-l);padding:34px 28px;text-align:center
  }
  .nf-code{
    font-size:56px;font-weight:750;letter-spacing:-2px;line-height:1;
    background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent
  }
  .nf-card h1{margin:14px 0 6px;font-size:17px;font-weight:650;color:var(--text)}
  .nf-card p{margin:0 0 22px;font-size:13px;color:var(--text-3);line-height:1.7}
  .nf-btn{
    display:inline-block;padding:11px 26px;border-radius:var(--radius);
    background:var(--gold-grad);color:var(--ink);font-size:14px;font-weight:650;
    text-decoration:none;box-shadow:0 4px 12px rgba(192,139,44,.3);transition:transform .16s var(--ease)
  }
  .nf-btn:hover{transform:translateY(-1.5px)}
</style>
</head>
<body>
  <div class="nf">
    <div class="nf-card">
      <div class="nf-code">404</div>
      <h1>页面不存在</h1>
      <p>这个地址没有对应的页面。<br>房间链接可能已经失效，或者输错了房间号。</p>
      <a class="nf-btn" href="/">回到首页</a>
    </div>
  </div>
</body>
</html>
